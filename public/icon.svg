<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8E7DFF"/>
      <stop offset="0.55" stop-color="#6750F2"/>
      <stop offset="1" stop-color="#3F2BC4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD66B"/>
      <stop offset="1" stop-color="#F5A524"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#glow)"/>
  <!-- rising path: the journey -->
  <path d="M120 372 C 196 360, 236 300, 286 262 S 360 200, 384 160" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="18" stroke-linecap="round"/>
  <!-- R monogram -->
  <path d="M178 378 V 140 H 262 a 70 70 0 0 1 0 140 H 178" fill="none" stroke="#FFFFFF" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M258 284 L 334 378" fill="none" stroke="#FFFFFF" stroke-width="46" stroke-linecap="round"/>
  <!-- coin -->
  <circle cx="398" cy="122" r="36" fill="url(#coin)"/>
  <circle cx="398" cy="122" r="36" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="6"/>
  <circle cx="398" cy="122" r="19" fill="none" stroke="#B86E00" stroke-opacity="0.45" stroke-width="7"/>
</svg>
